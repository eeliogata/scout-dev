[project]
name = "scout-dev"
version = "0.1.0"
description = "Company-specific threat intelligence from forum posts"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.162.7",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
    "requests[socks]>=2.34.2",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
deploy = [
    "modal==1.6.4",
]
